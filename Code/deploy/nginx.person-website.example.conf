# Person_Website as public homepage + MechAssist under /console/
# Copy onto the ECS as /etc/nginx/sites-available/mechassist (keep the existing filename).
# server_name: current nginx is 8.163.18.183; requested portal IP is 8.139.112.95.
# List both so either public IP works.

server {
    listen 80;
    server_name 8.139.112.95 8.163.18.183;

    root /var/www/Person_Website/Code/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /console/ {
        alias /var/www/MechAssist-Fusion/extern-api/dist/;
        try_files $uri $uri/ @console_spa;
    }

    location @console_spa {
        rewrite ^ /console/index.html last;
    }

    location = /console/index.html {
        alias /var/www/MechAssist-Fusion/extern-api/dist/index.html;
    }

    # M18-E remote TTS: local GPU via Tailscale may take >60s
    location /api/voice/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }

    location /api {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /auth {
        proxy_pass http://127.0.0.1:3002/api/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /agents-skill/ {
        alias /var/www/agents-skill-site/Code/code/docs/.vitepress/dist/;
        index index.html;
        try_files $uri $uri/ /agents-skill/index.html;
    }

    location /agents-skill-mcp/ {
        proxy_pass http://127.0.0.1:3921/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /gaode/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /glasses {
        return 301 /glasses/;
    }
    location /glasses/api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /glasses/health {
        proxy_pass http://127.0.0.1:8090/health;
    }
    location = /glasses/v2 {
        proxy_pass http://127.0.0.1:8090/v2;
    }
    location /glasses/ws/ {
        proxy_pass http://127.0.0.1:8090/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    location /glasses/ {
        alias /var/www/AI_Virtual_Glasses/web/apps/debug-console/dist/;
        index index.html;
    }
}
